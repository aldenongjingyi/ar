<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>MAP72 AR</title>

  <!-- Load A-Frame before MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <script>
    // Per-frame rotation — no loop reset, zero jitter
    AFRAME.registerComponent('smooth-rotate', {
      schema: { speed: { type: 'number', default: 30 } }, // degrees/sec
      tick: function(time, delta) {
        this.el.object3D.rotation.y += (this.data.speed * delta / 1000) * (Math.PI / 180);
      }
    });
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }

    #start-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(160deg, #4a2e0f 0%, #754c24 60%, #5c3a18 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      gap: 28px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    #start-overlay img.brand-logo {
      width: 200px;
      background: #fff;
      border-radius: 10px;
      padding: 16px 20px;
    }

    #start-overlay p {
      color: rgba(255,255,255,0.7);
      font-size: 15px;
      text-align: center;
      max-width: 260px;
      line-height: 1.6;
    }

    #start-btn {
      margin-top: 4px;
      padding: 16px 40px;
      border-radius: 50px;
      border: 2px solid rgba(255,255,255,0.4);
      background: rgba(255,255,255,0.15);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background 0.2s, transform 0.15s;
    }

    #start-btn:active {
      transform: scale(0.97);
      background: rgba(255,255,255,0.25);
    }

    #scan-hint {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(117,76,36,0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      padding: 12px 24px;
      border-radius: 50px;
      white-space: nowrap;
      z-index: 100;
      display: none;
      letter-spacing: 0.3px;
    }

    .mindar-ui-scanning .scanline { background: #754c24; }
  </style>
</head>
<body>

  <!-- Splash screen -->
  <div id="start-overlay">
    <img class="brand-logo" src="map72logo.png" alt="Map72">
    <p>Point your camera at the QR code to see the AR experience</p>
    <button id="start-btn" onclick="startAR()">Launch AR</button>
  </div>

  <div id="scan-hint">Point camera at the MAP72 QR code</div>

  <a-scene
    id="ar-scene"
    mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiLoading: yes; uiError: yes; uiScanning: yes;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-assets>
      <a-asset-item id="helmet" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/DamagedHelmet/glTF-Binary/DamagedHelmet.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- AR target: appears over the QR code -->
    <a-entity mindar-image-target="targetIndex: 0">

      <!-- 3D Model -->
      <a-gltf-model
        src="#helmet"
        position="0 0 0"
        scale="0.8 0.8 0.8"
        rotation="0 0 0"
        shadow="cast: true"
        smooth-rotate="speed: 30"
        animation__scale="property: scale; dir: alternate; dur: 3500; easing: easeInOutSine; loop: true; to: 0.88 0.88 0.88"
      ></a-gltf-model>

      <!-- Key light -->
      <a-light type="directional" color="#ffffff" intensity="2.0" position="2 4 3" shadow="cast: true"></a-light>
      <!-- Fill light -->
      <a-light type="directional" color="#e0e0e0" intensity="1.2" position="-2 4 -3" shadow="cast: true"></a-light>
      <!-- Back light -->
      <a-light type="spot" color="#ffffff" intensity="0.7" position="0 6 -5" angle="45" shadow="cast: true"></a-light>
      <!-- Ambient -->
      <a-light type="ambient" color="#d3d3d3" intensity="0.8"></a-light>

      <!-- Floating glow orb -->
      <a-entity
        geometry="primitive: sphere; radius: 0.05"
        material="color: #4DA8FF; emissive: #4DA8FF; emissiveIntensity: 1"
        position="0 0.38 0"
        animation="property: position; to: 0 0.48 0; dur: 1500; dir: alternate; loop: true; easing: easeInOutSine"
      ></a-entity>

    </a-entity>
    <!-- end mindar-image-target -->

  </a-scene>

  <script>
    function startAR() {
      const overlay = document.getElementById('start-overlay');
      const hint = document.getElementById('scan-hint');
      const scene = document.getElementById('ar-scene');

      overlay.style.display = 'none';
      hint.style.display = 'block';

      const tryStart = () => {
        const arSystem = scene.systems && scene.systems['mindar-image-system'];
        if (arSystem) {
          arSystem.start();
        } else {
          scene.addEventListener('loaded', () => {
            const sys = scene.systems['mindar-image-system'];
            if (sys) sys.start();
          }, { once: true });
        }
      };
      tryStart();
    }

    // Hide hint when target is found
    document.addEventListener('DOMContentLoaded', () => {
      const scene = document.getElementById('ar-scene');
      scene.addEventListener('targetFound', () => {
        document.getElementById('scan-hint').style.display = 'none';
      });
      scene.addEventListener('targetLost', () => {
        document.getElementById('scan-hint').style.display = 'block';
      });
    });
  </script>

</body>
</html>

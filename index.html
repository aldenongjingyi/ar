<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>MAP72 AR</title>

  <!-- Load A-Frame before MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <script>
    // Per-frame rotation — no loop reset, zero jitter
    AFRAME.registerComponent('smooth-rotate', {
      schema: { speed: { type: 'number', default: 30 } },
      tick: function(time, delta) {
        this.el.object3D.rotation.y += (this.data.speed * delta / 1000) * (Math.PI / 180);
      }
    });

    // Draws a clean pastel voucher card and applies it as a flat texture
    AFRAME.registerComponent('voucher-texture', {
      init: function () {
        const W = 1024, H = 512;
        const canvas = document.createElement('canvas');
        canvas.width = W; canvas.height = H;
        const ctx = canvas.getContext('2d');

        // Soft warm white background
        ctx.fillStyle = '#FDFAF5';
        ctx.fillRect(0, 0, W, H);

        // Subtle warm border
        ctx.strokeStyle = '#C9A96E'; ctx.lineWidth = 5;
        ctx.strokeRect(3, 3, W - 6, H - 6);

        // Top accent bar — soft tan
        ctx.fillStyle = '#E8D5B0';
        ctx.fillRect(3, 3, W - 6, 60);

        // Header
        ctx.fillStyle = '#7A5C2E'; ctx.font = 'bold 26px Arial'; ctx.textAlign = 'center';
        ctx.fillText('MAP72  ×  SUNWAY PYRAMID', W / 2, 42);

        // Thin divider
        ctx.strokeStyle = '#D4B896'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(60, 78); ctx.lineTo(W - 60, 78); ctx.stroke();

        // Offer label
        ctx.fillStyle = '#A07840'; ctx.font = '500 18px Arial';
        ctx.fillText('E X C L U S I V E   O F F E R', W / 2, 110);

        // Big soft discount text
        ctx.fillStyle = '#3D2B10'; ctx.font = 'bold 190px Arial'; ctx.textAlign = 'right';
        ctx.fillText('20%', 590, 315);
        ctx.fillStyle = '#C9A96E'; ctx.font = 'bold 90px Arial'; ctx.textAlign = 'left';
        ctx.fillText('OFF', 615, 295);

        // Divider 2
        ctx.strokeStyle = '#D4B896'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(60, 340); ctx.lineTo(W - 60, 340); ctx.stroke();

        // Description
        ctx.fillStyle = '#7A6248'; ctx.font = '22px Arial'; ctx.textAlign = 'center';
        ctx.fillText('Indoor Navigation Experience', W / 2, 378);
        ctx.fillStyle = '#AAA090'; ctx.font = '17px Arial';
        ctx.fillText('Valid at Sunway Pyramid  •  Limited Time Offer', W / 2, 410);

        // Bottom CTA bar
        ctx.fillStyle = '#E8D5B0';
        ctx.fillRect(3, H - 62, W - 6, 59);
        ctx.fillStyle = '#7A5C2E'; ctx.font = 'bold 24px Arial';
        ctx.fillText('Tap anywhere to claim', W / 2, H - 24);

        this.el.setAttribute('material', {
          src: canvas.toDataURL(),
          shader: 'flat',
          side: 'double'
        });
      }
    });

    // Adjusts GLTF material metalness/roughness for bright AR appearance
    AFRAME.registerComponent('gold-material', {
      schema: { metalness: { default: 0.4 }, roughness: { default: 0.55 } },
      init: function () {
        const setup = () => {
          this.el.object3D.traverse(node => {
            if (!node.isMesh || !node.material) return;
            const mats = Array.isArray(node.material) ? node.material : [node.material];
            mats.forEach(m => {
              m.metalness = this.data.metalness;
              m.roughness = this.data.roughness;
              m.needsUpdate = true;
            });
          });
        };
        if (this.el.getObject3D('mesh')) setup();
        else this.el.addEventListener('model-loaded', setup, { once: true });
      }
    });

    // Clips a GLTF model below a given model-space Y, so only the head/bust shows
    AFRAME.registerComponent('clip-below', {
      schema: { modelY: { type: 'number', default: 4.0 } },
      init: function () {
        this.clipPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
        this._pt = new THREE.Vector3();
        this.applied = false;
        const setup = () => {
          this.el.sceneEl.renderer.localClippingEnabled = true;
          this.el.object3D.traverse(node => {
            if (!node.isMesh) return;
            const mats = Array.isArray(node.material) ? node.material : [node.material];
            mats.forEach(m => { m.clippingPlanes = [this.clipPlane]; m.clipShadows = true; m.needsUpdate = true; });
          });
          this.applied = true;
        };
        // Handle both: model already loaded (cached) and not yet loaded
        if (this.el.getObject3D('mesh')) {
          setup();
        } else {
          this.el.addEventListener('model-loaded', setup, { once: true });
        }
      },
      tick: function () {
        if (!this.applied) return;
        this._pt.set(0, this.data.modelY, 0);
        this.el.object3D.localToWorld(this._pt);
        this.clipPlane.constant = -this._pt.y;
      }
    });

    // Sunway Pyramid lion head — geometric angular style matching the real statue
    AFRAME.registerComponent('lion-head', {
      init: function() {
        const G = this.el.object3D;
        const stone    = new THREE.MeshStandardMaterial({ color: 0xC4A882, metalness: 0.1, roughness: 0.75 });
        const shadow   = new THREE.MeshStandardMaterial({ color: 0x8B7355, metalness: 0.1, roughness: 0.85 });
        const dark     = new THREE.MeshStandardMaterial({ color: 0x1E1208, metalness: 0.0, roughness: 1.0  });
        const deep     = new THREE.MeshStandardMaterial({ color: 0x3D2B10, metalness: 0.0, roughness: 0.9  });

        const box = (w, h, d, x, y, z, mat, rx=0, ry=0, rz=0) => {
          const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
          m.position.set(x, y, z); m.rotation.set(rx, ry, rz); m.castShadow = true; G.add(m);
        };

        // ── ANGULAR MANE (the defining feature of the Sunway lion) ────────
        // Radial flat panels fanning around the head — like a sunburst
        const maneAngles = [
          [-75, 0.68], [-55, 0.78], [-35, 0.84], [-15, 0.86],
          [  5, 0.84], [ 25, 0.80], [ 45, 0.74], [ 65, 0.66],
          [ 85, 0.56], [105, 0.50], [125, 0.54], [145, 0.62],
          [165, 0.70], [-95, 0.62], [-115, 0.54], [-135, 0.50],
          [-155, 0.54]
        ];
        for (const [angleDeg, dist] of maneAngles) {
          const a = angleDeg * Math.PI / 180;
          // Each panel is a thin flat slab angled outward
          const px = Math.sin(a) * dist;
          const py = Math.cos(a) * dist * 0.85;
          const m = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.38, 0.06), shadow);
          m.position.set(px, py, -0.04);
          m.rotation.set(0, 0, -a);
          m.castShadow = true;
          G.add(m);
        }
        // Mane back fill (thick ring behind panels)
        const maneRing = new THREE.Mesh(
          new THREE.TorusGeometry(0.68, 0.16, 6, 20),
          shadow
        );
        maneRing.position.set(0, 0, -0.1);
        maneRing.rotation.set(Math.PI/2, 0, 0);
        G.add(maneRing);

        // ── HEAD BLOCK ───────────────────────────────────────────────────
        box(0.62, 0.70, 0.58, 0,  0.02, 0.06, stone);

        // ── FOREHEAD / BROW ───────────────────────────────────────────────
        box(0.56, 0.12, 0.10, 0,  0.25, 0.30, shadow);  // heavy brow

        // ── EYES (deep hollow oval sockets, characteristic of the statue) ─
        box(0.20, 0.14, 0.10, -0.15, 0.10, 0.30, dark);
        box(0.20, 0.14, 0.10,  0.15, 0.10, 0.30, dark);
        // Eye ridge above
        box(0.20, 0.05, 0.08, -0.15, 0.19, 0.31, shadow);
        box(0.20, 0.05, 0.08,  0.15, 0.19, 0.31, shadow);

        // ── SNOUT (protruding block — lion snout, not human) ──────────────
        box(0.42, 0.28, 0.18,  0, -0.08, 0.33, stone);   // upper snout
        box(0.38, 0.14, 0.16,  0, -0.24, 0.32, stone);   // lower jaw

        // ── NOSE (flat wide lion nose) ────────────────────────────────────
        box(0.20, 0.10, 0.10,  0, -0.02, 0.40, shadow);
        box(0.08, 0.04, 0.06, -0.07, -0.07, 0.41, dark); // left nostril
        box(0.08, 0.04, 0.06,  0.07, -0.07, 0.41, dark); // right nostril

        // ── MOUTH LINE ────────────────────────────────────────────────────
        box(0.36, 0.03, 0.06, 0, -0.175, 0.34, dark);

        // ── WHISKER LINES (carved lines on the snout) ────────────────────
        for (let i = 0; i < 3; i++) {
          const y = -0.05 - i * 0.055;
          box(0.15, 0.018, 0.02, -0.24, y, 0.33, deep);
          box(0.15, 0.018, 0.02,  0.24, y, 0.33, deep);
        }

        // ── CHEEK PLANES ─────────────────────────────────────────────────
        box(0.08, 0.22, 0.14, -0.33,  0.02, 0.26, shadow);
        box(0.08, 0.22, 0.14,  0.33,  0.02, 0.26, shadow);

        // ── CHIN ─────────────────────────────────────────────────────────
        box(0.30, 0.10, 0.14, 0, -0.33, 0.28, shadow);

        // ── EARS (small, partially hidden by mane) ────────────────────────
        box(0.12, 0.14, 0.08, -0.28, 0.40, 0.02, shadow);
        box(0.12, 0.14, 0.08,  0.28, 0.40, 0.02, shadow);

        // ── CHEST / UPPER BODY ────────────────────────────────────────────
        box(0.80, 0.22, 0.52, 0, -0.52, -0.02, stone);   // chest block
        box(0.90, 0.10, 0.56, 0, -0.64, -0.04, shadow);  // chest ledge
        // Chest panel lines
        box(0.78, 0.015, 0.50, 0, -0.56, -0.02, deep);
        box(0.78, 0.015, 0.50, 0, -0.48, -0.02, deep);
      }
    });
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }

    #start-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(160deg, #4a2e0f 0%, #754c24 60%, #5c3a18 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      gap: 28px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    #start-overlay img.brand-logo {
      width: 200px;
      background: #fff;
      border-radius: 10px;
      padding: 16px 20px;
    }

    #start-overlay p {
      color: rgba(255,255,255,0.7);
      font-size: 15px;
      text-align: center;
      max-width: 260px;
      line-height: 1.6;
    }

    #start-btn {
      margin-top: 4px;
      padding: 16px 40px;
      border-radius: 50px;
      border: 2px solid rgba(255,255,255,0.4);
      background: rgba(255,255,255,0.15);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background 0.2s, transform 0.15s;
    }

    #start-btn:active {
      transform: scale(0.97);
      background: rgba(255,255,255,0.25);
    }

    #scan-hint {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(117,76,36,0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      padding: 12px 24px;
      border-radius: 50px;
      white-space: nowrap;
      z-index: 100;
      display: none;
      letter-spacing: 0.3px;
    }

    .mindar-ui-scanning .scanline { background: #754c24; }

    #voucher-tap-area {
      position: fixed;
      inset: 0;
      z-index: 150; /* above AR canvas, below toggle (200) and success screen (9999) */
      display: none;
      cursor: pointer;
    }
    #voucher-tap-area.active { display: block; }

    #mode-toggle {
      position: fixed;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      background: rgba(20,12,4,0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 50px;
      padding: 5px;
      gap: 4px;
      z-index: 200;
      border: 1px solid rgba(255,215,0,0.3);
    }
    #mode-toggle.visible { display: flex; }
    .mode-btn {
      padding: 10px 22px;
      border-radius: 50px;
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.6);
      font-size: 14px;
      font-weight: 600;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: background 0.2s, color 0.2s;
    }
    .mode-btn.active {
      background: #FFD700;
      color: #0d0d22;
    }

    /* ── Voucher success overlay ─────────────────────────── */
    #voucher-success {
      position: fixed; inset: 0; z-index: 9999;
      display: none; align-items: center; justify-content: center;
      flex-direction: column;
    }
    #voucher-success.show { display: flex; }
    .vs-bg {
      position: absolute; inset: 0;
      background: rgba(60,40,20,0.55);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      animation: vsFadeIn 0.3s ease;
    }
    .vs-card {
      position: relative;
      background: #FDFAF5;
      border: 1.5px solid #D4B896;
      border-radius: 24px;
      padding: 44px 32px 36px;
      text-align: center;
      width: min(320px, 88vw);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      animation: vsSlideUp 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 8px 40px rgba(100,70,30,0.18);
    }
    .vs-check {
      width: 76px; height: 76px; border-radius: 50%;
      background: #E8D5B0;
      color: #7A5C2E; font-size: 38px; font-weight: 900;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
    }
    .vs-title { color: #3D2B10; font-size: 24px; font-weight: 700; margin: 0 0 16px; }
    .vs-brand { color: #A07840; font-size: 11px; letter-spacing: 2.5px; margin: 0 0 14px; text-transform: uppercase; }
    .vs-code {
      background: #F5ECD8; border: 1px solid #C9A96E;
      border-radius: 10px; color: #7A5C2E;
      font-size: 19px; font-weight: 700; font-family: monospace;
      letter-spacing: 3px; padding: 12px 20px; margin: 0 0 18px;
    }
    .vs-desc { color: #7A6248; font-size: 15px; line-height: 1.65; margin: 0 0 6px; }
    .vs-valid { color: #B0A090; font-size: 12px; margin: 0 0 28px; }
    .vs-done {
      background: #C9A96E;
      color: #FDFAF5; border: none; border-radius: 50px;
      padding: 15px 0; font-size: 16px; font-weight: 600;
      cursor: pointer; width: 100%;
      transition: transform 0.15s, background 0.15s;
    }
    .vs-done:active { transform: scale(0.97); background: #B8946A; }

    @keyframes vsFadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes vsSlideUp {
      from { transform: translateY(60px) scale(0.9); opacity: 0; }
      to   { transform: translateY(0)    scale(1);   opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Splash screen -->
  <div id="start-overlay">
    <img class="brand-logo" src="map72logo.png" alt="Map72">
    <p>Point your camera at the QR code to see the AR experience</p>
    <button id="start-btn" onclick="startAR()">Launch AR</button>
  </div>

  <div id="scan-hint">Point camera at the MAP72 QR code</div>

  <!-- Mode toggle — shown after AR starts -->
  <div id="mode-toggle">
    <button id="btn-lion"    class="mode-btn active" onclick="setARMode('lion')">Lion Head</button>
    <button id="btn-voucher" class="mode-btn"         onclick="setARMode('voucher')">Voucher</button>
  </div>

  <!-- Transparent tap catcher — active in voucher mode so any tap on the card claims it -->
  <div id="voucher-tap-area"></div>

  <!-- Voucher claimed success screen -->
  <div id="voucher-success">
    <div class="vs-bg"></div>
    <div class="vs-card">
      <div class="vs-check">✓</div>
      <p class="vs-brand">MAP72 × SUNWAY PYRAMID</p>
      <h2 class="vs-title">Voucher Claimed!</h2>
      <div class="vs-code">MAP72-SUNWAY-20</div>
      <p class="vs-desc">20% off Indoor Navigation<br>Experience at Sunway Pyramid</p>
      <p class="vs-valid">Valid until 31 Dec 2026 · Single use only</p>
      <button class="vs-done" onclick="closeVoucher()">Done</button>
    </div>
  </div>

  <a-scene
    id="ar-scene"
    mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiLoading: yes; uiError: yes; uiScanning: yes; filterMinCF: 0.0001; filterBeta: 0.001;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-assets>
      <a-asset-item id="sunway-lion" src="sunway_lion.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false">
      <a-entity cursor="fuse: false; rayOrigin: mouse"
                raycaster="objects: .tappable; far: 20; interval: 100"></a-entity>
    </a-camera>

    <!-- AR target: same QR, two modes toggled by the UI switch -->
    <a-entity mindar-image-target="targetIndex: 0">

      <!-- MODE 1: Lion head (default) -->
      <a-entity id="lion-group">
        <a-gltf-model
          src="#sunway-lion"
          position="0 0.55 0"
          scale="0.85 0.85 0.85"
          rotation="0 180 0"
          smooth-rotate="speed: 28"
          gold-material="metalness: 0.4; roughness: 0.55"
          animation__bob="property: position; from: 0 0.55 0; to: 0 0.63 0; dir: alternate; dur: 2400; easing: easeInOutSine; loop: true"
        ></a-gltf-model>

        <a-light type="ambient" color="#FFF5E0" intensity="3.5"></a-light>
        <a-light type="directional" color="#FFF8DC" intensity="2.5" position="0 3 3"></a-light>
        <a-light type="directional" color="#FFE080" intensity="2.0" position="-3 2 2"></a-light>
        <a-light type="directional" color="#FFE080" intensity="2.0" position="3 2 2"></a-light>
        <a-light type="directional" color="#FFFFFF" intensity="1.5" position="-2 0 -3"></a-light>
        <a-light type="directional" color="#FFFFFF" intensity="1.5" position="2 0 -3"></a-light>
        <a-light type="directional" color="#FFF0C0" intensity="1.0" position="0 -2 1"></a-light>

        <a-entity
          geometry="primitive: sphere; radius: 0.04"
          material="color: #FFD700; emissive: #FFD700; emissiveIntensity: 1"
          position="0 1.2 0"
          animation="property: position; to: 0 1.32 0; dur: 1800; dir: alternate; loop: true; easing: easeInOutSine"
        ></a-entity>
      </a-entity>

      <!-- MODE 2: Voucher card (hidden until toggled) -->
      <a-entity id="voucher-group" visible="false">
        <!-- Glow behind card -->
        <a-plane
          width="1.95" height="1.0"
          material="color: #FFD700; opacity: 0.1; transparent: true; shader: flat"
          position="0 0 -0.003"
          animation="property: material.opacity; from: 0.05; to: 0.18; dir: alternate; dur: 1400; loop: true; easing: easeInOutSine"
        ></a-plane>
        <!-- Voucher card — tappable -->
        <a-plane
          id="voucher-plane"
          class="tappable"
          width="1.8" height="0.9"
          voucher-texture
          position="0 0 0.002"
          animation__pulse="property: scale; from: 1 1 1; to: 1.03 1.03 1; dir: alternate; dur: 1400; loop: true; easing: easeInOutSine"
        ></a-plane>
      </a-entity>

    </a-entity>
    <!-- end AR target -->

  </a-scene>

  <script>
    function startAR() {
      const overlay = document.getElementById('start-overlay');
      const hint = document.getElementById('scan-hint');
      const scene = document.getElementById('ar-scene');

      overlay.style.display = 'none';
      hint.style.display = 'block';

      const tryStart = () => {
        const arSystem = scene.systems && scene.systems['mindar-image-system'];
        if (arSystem) {
          arSystem.start();
        } else {
          scene.addEventListener('loaded', () => {
            const sys = scene.systems['mindar-image-system'];
            if (sys) sys.start();
          }, { once: true });
        }
      };
      tryStart();
    }

    function setARMode(mode) {
      document.getElementById('lion-group').setAttribute('visible', mode === 'lion');
      document.getElementById('voucher-group').setAttribute('visible', mode === 'voucher');
      document.getElementById('btn-lion').classList.toggle('active', mode === 'lion');
      document.getElementById('btn-voucher').classList.toggle('active', mode === 'voucher');
      document.getElementById('voucher-tap-area').classList.toggle('active', mode === 'voucher');
    }

    function closeVoucher() {
      document.getElementById('voucher-success').classList.remove('show');
    }

    document.addEventListener('DOMContentLoaded', () => {
      const scene = document.getElementById('ar-scene');
      const toggle = document.getElementById('mode-toggle');

      scene.addEventListener('targetFound', () => {
        document.getElementById('scan-hint').style.display = 'none';
        toggle.classList.add('visible');
      });
      scene.addEventListener('targetLost', () => {
        document.getElementById('scan-hint').style.display = 'block';
        toggle.classList.remove('visible');
        setARMode('lion'); // reset to lion when QR lost
      });

      document.getElementById('voucher-tap-area').addEventListener('click', () => {
        document.getElementById('voucher-success').classList.add('show');
      });
    });
  </script>

</body>
</html>
